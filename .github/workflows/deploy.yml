name: Deploy to GitHub Pages

# One-time setup required in the repository:
#   Settings → Pages → Build and deployment → Source → "GitHub Actions"
# Without that, Pages keeps serving the old branch contents and this workflow's
# output is never published.

on:
  push:
    branches: [main]
  # Lets you re-publish from the Actions tab without pushing a commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead, and don't cancel one mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci needs the lockfile to match package.json exactly, which is what
      # we want for a reproducible build.
      - name: Install dependencies
        run: npm ci

      # The content files are typed against content/en.json, so a translation
      # that has drifted out of shape fails here rather than shipping broken.
      - name: Type check
        run: npm run typecheck

      - name: Build static export
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
